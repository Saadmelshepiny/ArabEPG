name: Build EPG

on:
  schedule:
    - cron: '17 1 * * *'
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-epg
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(python3 cloud/chan_tools.py matrix)" >> "$GITHUB_OUTPUT"

  grab:
    needs: setup
    name: grab ${{ matrix.site }} ${{ matrix.part }}/${{ matrix.parts }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          path: iptv-epg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iptv-epg/package-lock.json
      - name: Install grabber
        working-directory: iptv-epg
        run: npm ci --no-audit --no-fund
      - name: Grab
        continue-on-error: true
        run: bash cloud/grab.sh "${{ matrix.site }}" "${{ matrix.part }}" "${{ matrix.parts }}"
      - uses: actions/upload-artifact@v4
        with:
          name: grab-${{ matrix.site }}-${{ matrix.part }}
          path: work/out_*.xml
          if-no-files-found: ignore
          retention-days: 2

  publish:
    needs: grab
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          path: iptv-epg
          sparse-checkout: sites
      - uses: actions/checkout@v4
        with:
          repository: ziko-ZR1/Epg-plugin
          path: ziko
          sparse-checkout: configs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/pip
          key: argos-en-ar-v1
      - uses: actions/download-artifact@v4
        with:
          pattern: grab-*
          path: work
          merge-multiple: true
      - name: Build, translate and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cloud/publish.sh
