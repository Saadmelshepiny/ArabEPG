name: Unpack upload
on:
  push:
    paths: ['ArabEPG*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          f=$(ls ArabEPG*.zip | head -1)
          unzip -o "$f" -d . -x '.github/*'
          git rm -q --cached "$f" || true
          rm -f "$f"
          git config user.name "ArabEPG bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack $f"
          git push
